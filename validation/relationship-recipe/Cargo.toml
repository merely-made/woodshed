[package]
rust-version = "1.97.1"
name = "woodshed-relationship-recipe-proof"
version = "0.1.0"
edition = "2021"
publish = false

# A bounded compatibility instrument using the production shared revision.
[workspace]

[dependencies]
woodshed-core = { path = "../../crates/woodshed-core" }
woodshedding = { path = "../../crates/woodshedding" }
woodshed-views = { path = "../../crates/woodshed-views" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
async-trait = "0.1"
# woodshed-genet's storage.rs (included below by path) reaches djinn through Graphshell's application door.
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7", features = ["door"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
directories = "5"
scenograph = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
serde_json = "1"

[patch.crates-io]
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }

# Shared view and graph tests use the same provider as the production host.
netrender-vello = { git = "https://github.com/mark-ik/vello.git", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello.git", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello.git", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7ffe66208ca3059283ef8770de7d17aa8834ecc8", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7ffe66208ca3059283ef8770de7d17aa8834ecc8", version = "=0.1.2" }
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "7ffe66208ca3059283ef8770de7d17aa8834ecc8", version = "=0.14.0" }

