# Mere's netrender bridge, restated because root patches are not inherited:
# Genet names netrender through the plain GitHub URL, Mere's crates through the
# www alias at f4f9c0d8; this redirects the first to the second so the renderer
# family keeps one source identity (Mere b2c8dcc2, 2026-10-15).
