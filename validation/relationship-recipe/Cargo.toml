[package]
name = "woodshed-relationship-recipe-proof"
version = "0.1.0"
edition = "2021"
publish = false

# A bounded compatibility instrument using the production shared revision.
[workspace]

[dependencies]
woodshed-core = { path = "../../crates/woodshed-core" }
woodshedding = { path = "../../crates/woodshedding" }
woodshed-views = { path = "../../crates/woodshed-views" }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "0e78fcffb140395a5c0d2f64a4dfda2b81751681" }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
async-trait = "0.1"
# woodshed-genet's storage.rs (included below by path) reaches djinn through Graphshell.
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "0e78fcffb140395a5c0d2f64a4dfda2b81751681" }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "0e78fcffb140395a5c0d2f64a4dfda2b81751681" }
directories = "5"
scenograph = { git = "https://github.com/merely-made/mere.git", rev = "0e78fcffb140395a5c0d2f64a4dfda2b81751681" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "0e78fcffb140395a5c0d2f64a4dfda2b81751681" }
serde_json = "1"

# Graphshell's custody client rides Mere's p2panda fork; `[patch]` is per
# workspace root, so this restates Woodshed's rows.
[patch.crates-io]
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }

# Shared view and graph tests use the same provider as the production host.
netrender-vello = { git = "https://github.com/mark-ik/vello.git", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a" }
vello_encoding = { git = "https://github.com/mark-ik/vello.git", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a" }
vello_shaders = { git = "https://github.com/mark-ik/vello.git", rev = "5862bba26c8a9f56f6a5fdc8ea6966b360a5d63a" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "4bc75583865c2fb862b7acd7fe16dc28eb591042", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "4bc75583865c2fb862b7acd7fe16dc28eb591042", version = "=0.1.2" }
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "4bc75583865c2fb862b7acd7fe16dc28eb591042", version = "=0.14.0" }
