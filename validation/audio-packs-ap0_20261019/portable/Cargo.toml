[package]
name="ap0-portable"
version="0.0.0"
edition="2024"
publish=false
[dependencies]
audio-primitives={path="@WOODSHED_ROOT@/crates/audio-primitives"}
serde={version="1",features=["derive"]}
serde_json="1"
hound="=3.5.1"
midly={version="=0.5.3",default-features=false,features=["std","strict"]}

[features]
candidates=["dep:fundsp","dep:rustysynth"]
[dependencies.fundsp]
version="=0.23.0"
default-features=false
features=["std"]
optional=true
[dependencies.rustysynth]
version="=1.3.7"
optional=true
