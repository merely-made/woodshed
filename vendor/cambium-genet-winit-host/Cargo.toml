# Supplier snapshot: Mere d1a200b1877223f5b6ced7f5fbaca3671c10f5dd.
# Workspace/path dependencies expanded to their original Git source identities.
# See PATCHES.md. This is the one existing host, substituted via a source patch.
[package]
name = "cambium-genet-winit-host"
version = "0.1.0"
description = "The single-root Cambium desktop host: winit lifecycle, Livery/Buckram layout and paint, input routing, and AccessKit sync over one GenetAppRunner"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
publish = false

[features]
default = ["image-decode"]
image-decode = ["taproot/image-decode", "cambium-rootstock/image-decode", "cambium-winit-a11y/image-decode"]

[dependencies]
parley = { package = "genet-parley", version = "0.10.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
accesskit = "0.24"
light-file-dialog = "3.21.3"
meristem = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-rootstock = { version = "0.1.0", default-features = false, git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-winit = { version = "0.3.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-winit-a11y = { version = "0.3.0", default-features = false, git = "https://github.com/merely-made/mere.git", branch = "main" }
sprigging = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-winit-host = { git = "https://github.com/merely-made/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
netrender = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", rev = "e8cda06efc11c11595f2fa1bb30bce7e72979537" }
paint_list_api = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", rev = "e8cda06efc11c11595f2fa1bb30bce7e72979537" }
paint_list_render = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", rev = "e8cda06efc11c11595f2fa1bb30bce7e72979537" }
wgpu = { version = "30.0.1" }
genet-render-host = { git = "https://github.com/merely-made/genet.git", branch = "main" }
winit = { version = "0.30.13" }

[dev-dependencies]
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["estimated-probe-fixtures"] }
workbench = { version = "=0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
serde_json = { version = "1" }
mesquite = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = "0.3"
raw-window-handle = "0.6"

[target."cfg(target_os = \"linux\")".dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"

[target."cfg(target_os = \"windows\")".dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
