[package]
name = "ringdown-ble"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bluetooth transport for ringdown: drives a HyVibe guitar over BLE GATT."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ringdown = { workspace = true }
ringdown-client = { workspace = true }
btleplug = "0.11"
futures = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
uuid = "1"
