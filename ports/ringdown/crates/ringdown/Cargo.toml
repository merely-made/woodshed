[package]
name = "ringdown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sans-io client protocol for the HyVibe smart guitar: JSON-RPC over BLE, chunked transport, and the effect/parameter model."
keywords = ["guitar", "bluetooth", "ble", "jsonrpc", "audio"]
categories = ["network-programming", "no-std", "multimedia::audio"]

[lib]
path = "src/lib.rs"

[dependencies]
# JSON is the protocol, so a JSON implementation is not an optional dependency.
# Both are pulled without default features so the crate stays no_std; `alloc` is
# required because JSON values are inherently heap-shaped.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# preserve_order is load-bearing, not cosmetic: the instrument's JSON parser is
# order-sensitive (a `den` arriving before `num` is silently dropped), and
# serde_json's default BTreeMap alphabetizes keys. A test in rpc.rs pins this.
serde_json = { version = "1", default-features = false, features = ["alloc", "preserve_order"] }
