[workspace]
resolver = "3"
members = [
    "crates/hocket-engine",
    "crates/hocket-headless",
    # The genet-host UI (2026-07-08 refactor). At the parity cut the Masonry
    # `hocket` bin + `hocket-widgets` were deleted; this is the only UI now.
    "crates/hocket-genet",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/merely-made/woodshed/tree/main/ports/hocket"

rust-version = "1.97.1"

[workspace.dependencies]
# Shared Hocket libraries are owned by the root library workspace; this
# independent application workspace keeps its engine and native/headless hosts.
# One Cambium source identity is required for the shared surface and its host.
hocket-engine = { path = "crates/hocket-engine", version = "0.1.0" }
hocket-project = { path = "../../crates/hocket-project", version = "0.1.0" }
hocket-model = { path = "../../crates/hocket-model", version = "0.1.0" }
hocket-recorder = { path = "../../crates/hocket-recorder", version = "0.1.0" }
hocket-views = { path = "../../crates/hocket-views", version = "0.1.0" }

# Shared pure-DSP primitives — the `audio-primitives` extraction (click
# synth, streaming onset/tempo, latency estimation). Lives in the
# woodshed root (seeded from its mature DSP); consumed through the explicit
# shared-crate boundary. hocket-engine's click loop calls the shared click synth;
# the onset/tempo + latency cores are here for FT3c (calibration) and
# bar-alignment work. Pure std, no engine/UI coupling.
audio-primitives = { path = "../../crates/audio-primitives", version = "0.1.0" }

# Portable durable-byte seam shared with Woodshed and Isometry. Hocket keeps
# its own model and MediaRef identity; muniment owns backend mechanics.
muniment = { version = ">=0.1.0, <0.3", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
armillary = { version = "0.1.0", git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
# Identity root for signed, recipient-bound hand-off envelopes. This is a
# host-agnostic protocol dependency, not project/session state.
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main", version = "0.3.0" }
# djinn's custody route: Hocket speaks as the persona djinn holds and opens no
# vault, record or DPAPI root of its own (dramatis D5, D13).
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
djinn = { git = "https://github.com/merely-made/armillary.git", rev = "721e17d41a8f258073f440adbbb39ad145250868", version = "0.0.3", default-features = false, features = ["custody-client"] }
# The derived-key attestation a hand-off envelope carries; personae no longer
# re-exports it (insigne proofs plan).
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
# The promoted hocket-project library owns its exact Wavicle dependency.
# MediaRef remains BLAKE3 over capture rate and decoded f32 samples.

# Standalone Firewheel 0.14 with the owned bounded stream-node foundation.
# Keep the exact pushed revision coherent with the other audio consumers.
firewheel = { git = "https://github.com/mark-ik/firewheel.git", rev = "2b03846d2e0dcc6ded2a85367bb8c5071ae99cdc", version = "0.14", features = [
    "cpal",
    "symphonium",
    "peak_meter_node",
    "stream_nodes",
] }

# Woodshed-audio is no longer a Hocket dependency as of FT3b-prime —
# the SequencerEngine wrap retired in favor of the Firewheel graph.
# Hocket is now the *pressure vessel* for the reusable audio layer;
# the relationship to Woodshed is via future shared crates
# (audio-primitives, audio-widgets, audio-devices), not direct
# coupling. See memory/project_hocket_audio_pressure_vessel.md.

winit = "0.30"

# **The Cambium family moved from genet to mere on 2026-09-03** (the platform
# boundary pass). `cambium`, `sprigging`, `cambium-genet-winit-host`,
# `workbench` and `tinct` are mere workspace members under `crates/cambium/`
# now, and `genet-host-api`'s application half is mere's `mere-surface-api`;
# genet keeps the raw engine seams below. Both sources are pinned by exact
# revision, and the genet revision is the one mere itself pins, so the graph
# carries one `LayoutDom` and one Cambium.
#
# UI — Genet host. `cambium-genet-winit-host` owns the retained
# Livery/Buckram layout, paint, input, and accessibility assembly; Hocket
# supplies its state, views, leaves, workers, and update policy through hooks.
# Git deps on the owned repos. Build hocket-genet from the hocket cwd so this
# workspace's root Cargo patches apply.
# From genet's git, NOT crates.io. The published pair depends on the
# crates.io `paint_list_api`, while we (and the rest of the genet stack)
# git-dep netrender's — two `paint_list_api` crates in one graph, so a
# `sprigging::PaintCmd` is not a `paint_list_api::PaintCmd` and `leaves.rs`
# fails to compile. `[patch.crates-io]` does NOT resolve this; taking them
# from the same source everything else uses does. Found 2026-07-24 on a
# clean checkout (the Linux box), which is the only place it shows: a dev
# machine's gitignored patch file redirects these to local checkouts that
# git-dep netrender, unifying the graph by accident.
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.6.0" }
sprigging = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.3.0" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
cambium-desktop = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.1.0" }
genet-clipboard = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# genet renamed genet-probe to taproot (7baa554c); the scenario driver follows
# it at the revision Woodshed's own taproot row names.
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main" }
mere-surface-api = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.1.0" }
workbench = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
# Match Genet's immutable Netrender source identity. A branch reference here
# creates a second `ExternalTexturePlacement` beside the host's renderer API.
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
# Host-side surface/compose types only; backend features come from
# netrender's per-target split. Single wgpu 29 tree now the Masonry app
# (wgpu 28) is retired.
wgpu = { version = "30", default-features = false, features = ["std"] }
# Pure OKLCH seed-to-palette theming (shared; woodshed's too). A Cambium
# component, in mere since the 2026-09-03 boundary pass; the standalone mirror
# repo retired with the 2026-07-23 consolidation.
tinct = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.2.0" }
mesquite = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["native-host"] }

# Auto-update (2026-07-24 auto-update plan). Luggage is the family's update
# pipeline (the cargo-packager-updater fork living in mere; ruled 2026-07-24):
# signed manifests over pluggable feeds, packed with upstream's cargo-packager
# CLI, Rust everywhere. Velopack stays wired as the A/B alternative
# (HOCKET_UPDATE_TRANSPORT=velopack) until one of the two retires.
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
velopack = "1.2.0"

# Audio file decoding/encoding; native I/O is supplied by Firewheel.
hound = "3.5"

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CBOR (RFC 8949) for the durable project manifest and the hand-off envelope.
# Self-describing and cross-language, and the serialization Moothold uses, so
# saved bytes and handed-off bytes are the same format. Replaced postcard at
# the FT8 serialization migration (2026-07-14).
ciborium = "0.2"

# Identifiers
uuid = { version = "1.10", features = ["v4", "serde"] }

# Content hashing for media (engine-side only — model just stores bytes)
blake3 = "1.5"

# Async runtime (UI side; never on the audio thread)
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "time", "sync"] }

# Mirror of genet's [patch.crates-io] entries this workspace's genet graph
# needs (patches are per-workspace-root, not inherited through git deps —
# woodshed carries the same mirror). Keep in sync with genet's fork pins.
[patch.crates-io]
# Mirror the promoted access-tree and document-session suppliers; workspace
# patches are not inherited from Mere or Genet Git dependencies.
accesskit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
# Deliberately NO netrender patches here: `[patch.crates-io]` does not
# redirect a published crate's own registry dependency (tried 2026-07-24 —
# the crates.io `paint_list_api` stayed in the graph). Taking cambium and
# sprigging from genet's git instead is what unifies the source.
# NO stylo/stylo_atoms patch (removed 2026-07-12, mirroring genet): the fork
# is now the RENAMED `genet-stylo` family, and a `[patch]` cannot rename its
# target. Genet's crates git-dep genet-stylo by package rename instead, so no
# crates.io `stylo` remains in the graph to patch. Keeping the old patch
# reintroduced the pre-rename fork beside genet-stylo, and
# `links = "servo_style_crate"` (one Stylo per graph) made that a hard error.
#
# The Stylo compatibility cone retired from Genet. Livery/Buckram use the
# renamed `genet-taffy` fork and Genet's `genet-parley` directly; only Taffy
# needs a row at this workspace root.
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.14.0" }
# Genet's in-process ipc-channel fork is also a root-level Cargo patch.

# Classic 0.11 and its encoding/shader types share the maintained wgpu-30
# provider. Cargo patches are per workspace root and are not inherited.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]
# Promoted sources shared with immutable older Mere suppliers.
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }

[patch."https://www.github.com/merely-made/mere.git"]
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "92d5b15cf39aaac40a3f2d863ffee69c9be11bfc" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "aa94fe22eea29e9b54e01ed21e6991536ed4f208" }
