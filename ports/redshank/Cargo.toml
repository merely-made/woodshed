[workspace]
resolver = "3"
members = ["model", "storage"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
redshank-model = { path = "model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
