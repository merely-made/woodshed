[workspace]
resolver = "3"
members = ["cache", "desktop", "feed", "model", "storage", "surfaces", "playback", "web"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"

[workspace.dependencies]
apparatus = { package = "mere-apparatus", git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3", default-features = false, features = ["serde"] }
mesquite = { git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3" }
timed-text = { path = "../../crates/timed-text", version = "0.1.0" }
cambium = { git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3" }
tinct = { git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3" }
# The surface-descriptor half of a host's product-admission vocabulary. Same
# Mere revision as cambium: the descriptor crosses the seam between Redshank
# and an embedding host, so one revision or the types do not match themselves.
mere-surface-api = { git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
# Named genet-probe until genet 7baa554c (2026-09-14); same crate, new name.
taproot = { git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
servo-media-player = { git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
# Shared pure-std DSP primitives from the woodshed root, consumed through
# the explicit shared-crate boundary as Hocket does: the WSOLA stretcher
# behind the playback-rate dock lives there, not in a port-local copy.
audio-primitives = { path = "../../crates/audio-primitives", version = "0.1.0" }
redshank-model = { path = "model" }
redshank-cache = { path = "cache" }
redshank-feed = { path = "feed" }
redshank-storage = { path = "storage" }
redshank-surfaces = { path = "surfaces" }
redshank-playback = { path = "playback" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
blake3 = "1"
cpal = "0.17.3"
firewheel = { version = "0.10", default-features = false, features = ["std", "cpal", "stream_nodes", "tracing"] }
hound = "3.5"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
# The host's fetch handle: one HTTP policy (cookies, cache, HSTS, transport)
# for streaming, downloads and feeds. Same Mere revision as cambium. Defaults
# off: a listener takes the handle over netfetcher and none of the page actor.
fetch = { package = "mere-fetch", git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3", default-features = false }
rfd = "0.17"
errand = { git = "https://github.com/merely-made/mere.git", rev = "bd5912fbbb8f468defc3bbeee7eac5a4f7d2b2f3", version = "0.3.4" }
url = "2.5"

# Root patches do not cross a git dependency boundary, so a standalone Redshank
# build restates Mere's exact immutable patch.
#
# No parley/fontique rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row here would match no package and fail resolution. Mere
# dropped its own rows at 767664df for the same reason; genet-livery reaches the
# fork by path inside the git checkout.
[patch.crates-io]
# servo-media-player depends on ipc-channel 0.22; this keeps it on genet's
# vendored in-process fork (support/patches/ipc-channel) rather than the
# crates.io release. Mere dropped its own row at 250fd238 because nothing in
# Mere's graph uses ipc-channel any more; this graph still does, through
# servo-media-player, so the row is live here.
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
