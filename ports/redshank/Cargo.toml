[workspace]
resolver = "3"
members = ["desktop", "model", "storage", "surfaces"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
cambium = { git = "https://github.com/merely-made/mere.git", rev = "9f8f44047ede353fc256d46d48b226d79903e770" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "9f8f44047ede353fc256d46d48b226d79903e770" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
redshank-model = { path = "model" }
redshank-storage = { path = "storage" }
redshank-surfaces = { path = "surfaces" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Mere's desktop host reaches Genet Livery, whose Parley fork carries the text
# APIs it consumes. Root patches do not cross a git dependency boundary, so a
# standalone Redshank build restates Mere's exact immutable patch.
[patch.crates-io]
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
