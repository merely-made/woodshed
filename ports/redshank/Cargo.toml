[workspace]
resolver = "3"
members = ["cache", "desktop", "feed", "model", "storage", "surfaces", "playback", "web"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"

[workspace.dependencies]
cambium = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85" }
tinct = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
# Named genet-probe until genet 7baa554c (2026-09-14); same crate, new name.
taproot = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
servo-media-player = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
# Shared pure-std DSP primitives from the woodshed root, consumed through
# the explicit shared-crate boundary as Hocket does: the WSOLA stretcher
# behind the playback-rate dock lives there, not in a port-local copy.
audio-primitives = { path = "../../crates/audio-primitives", version = "0.1.0" }
redshank-model = { path = "model" }
redshank-cache = { path = "cache" }
redshank-feed = { path = "feed" }
redshank-storage = { path = "storage" }
redshank-surfaces = { path = "surfaces" }
redshank-playback = { path = "playback" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
anyhow = "1"
blake3 = "1"
cpal = "0.17.3"
firewheel = { version = "0.10", default-features = false, features = ["std", "cpal", "stream_nodes", "tracing"] }
hound = "3.5"
http = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
rfd = "0.17"
errand = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85", version = "0.3.4" }
url = "2.5"

# Mere's desktop host reaches Genet Livery, whose Parley fork carries the text
# APIs it consumes. Root patches do not cross a git dependency boundary, so a
# standalone Redshank build restates Mere's exact immutable patch.
[patch.crates-io]
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
