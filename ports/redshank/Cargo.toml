[workspace]
resolver = "3"
members = ["desktop", "model", "storage", "surfaces", "playback"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
cambium = { git = "https://github.com/merely-made/mere.git", rev = "54a51396d9d24a5435bcafecb878da9deecaf6c5" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "54a51396d9d24a5435bcafecb878da9deecaf6c5" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "9e8f9dc2f3ddc0af1658580bb51964462a03923f" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "9e8f9dc2f3ddc0af1658580bb51964462a03923f" }
servo-media-player = { git = "https://github.com/merely-made/genet.git", rev = "9e8f9dc2f3ddc0af1658580bb51964462a03923f" }
redshank-model = { path = "model" }
redshank-storage = { path = "storage" }
redshank-surfaces = { path = "surfaces" }
redshank-playback = { path = "playback" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
blake3 = "1"
firewheel = { version = "0.10", default-features = false, features = ["std", "cpal", "stream_nodes", "tracing"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
rfd = "0.17"

# Mere's desktop host reaches Genet Livery, whose Parley fork carries the text
# APIs it consumes. Root patches do not cross a git dependency boundary, so a
# standalone Redshank build restates Mere's exact immutable patch.
[patch.crates-io]
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "9e8f9dc2f3ddc0af1658580bb51964462a03923f" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "9e8f9dc2f3ddc0af1658580bb51964462a03923f" }
