[workspace]
resolver = "3"
members = ["cache", "desktop", "feed", "model", "storage", "surfaces", "playback", "web"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

rust-version = "1.97.1"

[workspace.dependencies]
apparatus = { package = "mere-apparatus", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["serde"] }
mesquite = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", branch = "main" }
timed-text = { path = "../../crates/timed-text", version = "0.1.0" }
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tinct = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# The surface-descriptor half of a host's product-admission vocabulary. Same
# Mere revision as cambium: the descriptor crosses the seam between Redshank
# and an embedding host, so one revision or the types do not match themselves.
mere-surface-api = { git = "https://github.com/merely-made/mere.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Named genet-probe until genet 7baa554c (2026-09-14); same crate, new name.
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
servo-media-player = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Shared pure-std DSP primitives from the woodshed root, consumed through
# the explicit shared-crate boundary as Hocket does: the WSOLA stretcher
# behind the playback-rate dock lives there, not in a port-local copy.
audio-primitives = { path = "../../crates/audio-primitives", version = "0.1.0" }
redshank-model = { path = "model" }
redshank-cache = { path = "cache" }
redshank-feed = { path = "feed" }
redshank-storage = { path = "storage" }
redshank-surfaces = { path = "surfaces" }
redshank-playback = { path = "playback" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
anyhow = "1"
blake3 = "1"
cpal = "0.17.3"
firewheel = { git = "https://github.com/mark-ik/firewheel", rev = "2b03846d2e0dcc6ded2a85367bb8c5071ae99cdc", default-features = false, features = ["std", "cpal", "stream_nodes", "tracing"] }
hound = "3.5"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
# The host's fetch handle: one HTTP policy (cookies, cache, HSTS, transport)
# for streaming, downloads and feeds. Same Mere revision as cambium. Defaults
# off: a listener takes the handle over netfetcher and none of the page actor.
fetch = { package = "mere-fetch", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
rfd = "0.17"
errand = { version = "0.4.0", git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
url = "2.5"

# Root patches do not cross a git dependency boundary, so a standalone Redshank
# build restates Mere's exact immutable patch.
#
# No parley/fontique rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row here would match no package and fail resolution. Mere
# dropped its own rows at 767664df for the same reason; genet-livery reaches the
# fork by path inside the git checkout.
[patch.crates-io]
# Promoted sources shared with immutable older Mere suppliers.
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "6827559937f07f78a6a830dfbfcaa54210dd093c" }
commons-spine = { git = "https://github.com/merely-made/gemot.git", rev = "6a5023a9ca478ebcc342dd9b7c9e418ccacfc6b5" }
esp = { git = "https://github.com/merely-made/esp.git", rev = "a2561b0b9766a4ad4d9924c02194bb414667b9ef" }
gemot = { git = "https://github.com/merely-made/gemot.git", rev = "6a5023a9ca478ebcc342dd9b7c9e418ccacfc6b5" }
mien = { git = "https://github.com/merely-made/gemot.git", rev = "6a5023a9ca478ebcc342dd9b7c9e418ccacfc6b5" }
moothold = { git = "https://github.com/merely-made/gemot.git", rev = "6a5023a9ca478ebcc342dd9b7c9e418ccacfc6b5" }
mooting = { git = "https://github.com/merely-made/gemot.git", rev = "6a5023a9ca478ebcc342dd9b7c9e418ccacfc6b5" }
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
dict-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
errand = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
fsp-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
gopher-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
guppy-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
hagiograph = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
kepler-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
luggage = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
misfin = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
nex-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
scorpion-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
text-protocol = { git = "https://github.com/merely-made/errand.git", rev = "dce1f08546b8475e42a5a01ca1ea18794c6e9b97" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", rev = "de6b1dce75dd6725d72c79b829e4878c7903a381" }
# Dependency workspaces do not propagate patches. Keep the renderer and both
# shader packages on the published Classic 0.11/wgpu-30 provider.
netrender-vello = { git = "https://github.com/mark-ik/vello.git", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello.git", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello.git", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
# servo-media-player depends on ipc-channel 0.22; this keeps it on genet's
# vendored in-process fork (support/patches/ipc-channel) rather than the
# crates.io release. Mere dropped its own row at 250fd238 because nothing in
# Mere's graph uses ipc-channel any more; this graph still does, through
# servo-media-player, so the row is live here.
ipc-channel = { git = "https://github.com/merely-made/genet.git", branch = "main" }

