[workspace]
resolver = "3"
members = ["model", "storage", "surfaces"]
exclude = ["spikes/playback"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
cambium = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
redshank-model = { path = "model" }
redshank-surfaces = { path = "surfaces" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
