[package]
name = "redshank-web"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"

rust-version = "1.97.1"
description = "Redshank in a browser: the same surfaces the desktop draws, mounted on a canvas."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same surfaces the desktop binary draws. Not a reimplementation.
redshank-surfaces = { path = "../surfaces" }
redshank-model = { path = "../model" }
# The Mere pin this workspace is on.
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "90ce8f12d80d002303eada6b4ab9da9d7a530d83" }
cambium-rootstock = { git = "https://www.github.com/merely-made/mere.git", rev = "90ce8f12d80d002303eada6b4ab9da9d7a530d83" }
cambium-genet-web-host = { git = "https://www.github.com/merely-made/mere.git", rev = "90ce8f12d80d002303eada6b4ab9da9d7a530d83" }

# The browser, declared for wasm32 only so a native workspace build resolves
# none of it and this crate compiles to nothing off wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.129"
# An async `#[wasm_bindgen]` fn expands into this crate.
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Location", "Window"] }
