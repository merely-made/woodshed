[package]
name = "woodshed-graph"
version = "0.1.0"
edition.workspace = true

rust-version = "1.97.1"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "woodshed's real theory catalog (scales, chords, progressions, exercises) related as a content-addressed container graph over chartulary, with practice lineage over `chartulary::stemma`. The chartulary substrate's first real consumer (G3), proving the stack end to end on woodshed's existing data."
keywords = ["knowledge-graph", "music-theory", "chartulary", "woodshed"]
categories = ["data-structures"]

[dependencies]
# The chartulary substrate lives in sibling repos alongside woodshed.
chartulary = { git = "https://www.github.com/merely-made/mere.git", rev = "8357b00d0e692dec3a377c842e82d5e396d43d09" }
# woodshed's own theory-catalog crate, now a workspace sibling.
woodshedding = { workspace = true }
