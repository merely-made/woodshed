[package]
name = "woodshed-notation"
version = "0.1.0"
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
repository.workspace = true
description = "Chart, tablature and staff notation leaves over woodshedding musical documents"
build = "build.rs"

[lib]
# The cdylib is built only when this package is the build root (the wasm block guest);
# dependents link the rlib as before.
crate-type = ["rlib", "cdylib"]

[features]
# Native consumers keep the leaf's fallback labels and playback description.
# Hosts supplying their own accessible controls can omit this adapter, avoiding
# a second direct AccessKit version beside their Sprigging host's contract.
default = ["accessibility"]
accessibility = ["dep:accesskit"]
# The `block-guest` world of `mere:script`: a pure wasm component a host loads to edit
# and show a Djot `progression` block. The WIT comes from `graphshell-endpoint` (the
# build script copies it to the git-ignored `wit/`).
block-guest = [
    "woodshedding/blocks",
    "dep:graphshell-endpoint",
    "dep:wit-bindgen",
    "dep:vector-sheet",
    "dep:sceno",
    "dep:sceno-backdrops",
    "dep:paint_list_api",
    "dep:ciborium",
    "dep:serde_json",
]

# Signs the component into the pack a host reviews (`examples/build_block_pack.rs`).
block-pack = ["block-guest", "dep:eidetic", "dep:personae"]

[[example]]
name = "build_block_pack"
required-features = ["block-pack"]

[dependencies]
woodshedding.workspace = true
sprigging.workspace = true
accesskit = { version = "0.25", optional = true }
ttf-parser = "0.25.1"
wit-bindgen = { version = "0.57", optional = true }
graphshell-endpoint = { workspace = true, optional = true }
vector-sheet = { workspace = true, optional = true }
sceno = { workspace = true, optional = true }
sceno-backdrops = { workspace = true, optional = true }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main", optional = true }
ciborium = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main", features = ["pack-signing"], optional = true }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main", optional = true }

[dev-dependencies]
serde_json.workspace = true
# The conformance test loads the real pack through Mere's host: a guest above its host.
graphshell = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["editable-blocks", "applets"] }
graphshell-blocks = { git = "https://github.com/merely-made/mere.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main", features = ["pack-signing"] }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
cambium = { workspace = true }

[lints]
workspace = true
