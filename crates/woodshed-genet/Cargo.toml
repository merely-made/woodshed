[package]
name = "woodshed-genet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Woodshed's desktop application over the shared Cambium desktop host: state, views, backends, and the self-drive lane. The native host itself is genet's."

[dependencies]
# The desktop realization of muniment's Backend. woodshed-core names the slots;
# this crate only decides which file each one lives in.
muniment = { git = "https://github.com/merely-made/mere.git", rev = "7d2a5f3cfe97174058368073d2bae809fffbf902" }
# The family-shared identity vault: which persona this machine practices as,
# and the key its practice session is sealed under. Desktop-only, which is why
# it is declared here rather than in the portable core. Declared in the
# workspace since P1, because woodshed-views names the `Roster` too.
personae = { workspace = true }
async-trait = "0.1"
woodshed-core = { workspace = true }
woodshedding = { workspace = true }
woodshed-audio = { workspace = true }
woodshed-views = { path = "../woodshed-views" }
cambium = { workspace = true }
# The shared single-root Cambium desktop host (genet G1). It owns the winit
# lifecycle, the surface, layout, paint, hit testing, input routing, and the
# AccessKit sync woodshed used to assemble by hand — so the direct deps that
# assembly needed (genet-layout, genet-winit-host, cambium-winit,
# cambium-winit-a11y, netrender, paint_list_*) are gone from this manifest.
# Woodshed is now the first consumer of that boundary rather than its donor.
cambium-genet-winit-host = { workspace = true }
cambium-rootstock = { workspace = true }
tabard-workshop = { workspace = true }
sprigging = { workspace = true }
# Preserve the wrapped graph leaf's accessibility publication.
accesskit = "0.24"
layout-dom-api = { workspace = true }
genet-scripted-dom = { workspace = true }
# The shared automatability substrate: selector resolution + the scenario
# driver, so woodshed's self-drive lane is the genet one, not a private copy.
taproot = { workspace = true }
mesquite = { workspace = true }
# Window types used by the native chrome hooks. Mesquite owns GPU readback.
winit = { workspace = true }
directories = "5"
serde_json = { workspace = true }
# The shared persona picker's event type. The list itself is drawn in
# woodshed-views; this crate only reads what the user answered.
persona-picker = { workspace = true }

[dev-dependencies]
# The persona-gate tests build a real vault in a scratch directory rather than
# mocking the roster: what is being tested is a decision about a vault.
tempfile = "3"
