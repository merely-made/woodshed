[package]
name = "woodshed-instrument"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

rust-version = "1.97.1"
description = "Shared standard MIDI instrument I/O, messages and clock tracking."
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["midi"]
midi = ["dep:midir"]
ble-midi = ["midi", "dep:ble-peripheral-rust", "dep:tokio", "dep:uuid"]

[dependencies]
serde = { workspace = true }
midir = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
ble-peripheral-rust = { path = "../../vendor/ble-peripheral-rust", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
uuid = { version = "1", optional = true }
