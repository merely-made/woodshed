[package]
name = "woodshed-instrument"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Connection and device state for a Bluetooth-controlled smart instrument, joining Woodshed's practice concepts to the instrument's own."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Ringdown is an independent nested workspace under ports/. The local paths
# keep its publish-tier core and unpublished BLE shell on the same revision.
ringdown = { path = "../../ports/ringdown/crates/ringdown", version = "0.1.0" }
ringdown-ble = { path = "../../ports/ringdown/crates/ringdown-ble", version = "0.0.1" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
