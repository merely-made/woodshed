[package]
rust-version = "1.97.1"
name = "woodshed-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Woodshed's portable state/logic core: app state over the woodshedding theory crate, no UI or host dependency. The genet-host plan's W1.1 split; S1 ships the Stage slice."

[dependencies]
woodshedding = { workspace = true }
woodshed-graph = { workspace = true }
# The portable scene contract. woodshed owns the musical facts and
# their typed relations; sceno owns placement, footprints, representation, and
# routing. Sibling repo, like woodshed-graph's chartulary dep.
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
# Shared authored appearance definition in portable settings.
tabard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Persona-keyed encrypt-at-rest for the private practice session — the woodshed
# pole of the personae suite adoption (one persona, many devices, sealed state).
# Sibling repo, like woodshed-graph's chartulary path dep.
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
# The portable persistence seam. woodshed's own Storage/SettingsStorage traits
# were a two-slot, String-shaped restatement of muniment's SlotStore, with one
# filesystem realization against muniment's shipped redb/zip/IndexedDB/memory.
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
async-trait = "0.1"
# muniment's Backend is async so a browser can await OPFS; woodshed's save path
# is the sync event loop, and a filesystem backend returns ready futures, so
# driving them to completion costs a poll.
pollster = "0.4"
# The lineage model the practice history is stored as (adopted 2026-07-26):
# dated, branching engagements over stable catalog ids, with per-subject recency
# and frequency maintained upstream. Already in the workspace through
# woodshed-graph's catalog graph; the same sibling-repo git dep.
chartulary = { git = "https://www.github.com/merely-made/mere.git", rev = "b2c8dcc2860b146387b3ca076c18f994bcb80ad7" }
hex = "0.4"
# Portable lossless companion storage; no audio driver or device dependency.
wavicle = { git = "https://github.com/merely-made/wavicle.git", rev = "2c5a49fd48db7a54aeab9e712804fd065411aef9", default-features = false, features = ["encode", "decode"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
