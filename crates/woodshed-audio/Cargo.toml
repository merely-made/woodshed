[package]
name = "woodshed-audio"
version = "0.1.0"
description = "One Firewheel output graph for practice click, preview and backing, with independently lazy CPAL tuner and bounded capture input."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

rust-version = "1.97.1"
readme = "../../README.md"
keywords = ["audio", "tuner", "metronome", "pitch-detection", "guitar"]
categories = ["multimedia::audio"]

[dependencies]
# Shared pure-DSP primitives — onset/tempo cores, latency estimation,
# click synthesis. The driver layers (OnsetAnalyzer, CalibrationSession,
# Sound::Click voice) in this crate are built on top of these.
audio-primitives = { workspace = true }
cpal = { workspace = true }
firewheel = { workspace = true }
rtrb = { workspace = true }
audioadapter-buffers = { workspace = true }
pitch-detector = { workspace = true }
pitch-detection = { workspace = true }
hound = { workspace = true }
midir = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
