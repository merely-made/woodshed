[package]
name = "woodshedding"
version = "0.1.0"
description = "Portable core for woodshedding: pure theory, string-instrument realization, progressions, exercises, fretboard mapping, voicings, and practice sets. No I/O, UI, or audio."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

rust-version = "1.97.1"
readme = "README.md"
keywords = ["music", "theory", "guitar", "scale", "chord"]
categories = ["multimedia::audio", "data-structures"]

[features]
# Block-adapter logic for a host's Djot block pane (`blocks`): plain Rust over this
# crate's types, reading the `woodshed` source attribute as JSON. Off by default.
blocks = ["dep:serde_json"]

[dependencies]
# Card/set vocabulary (the `rehearsal` module) derives serde so app and
# future CLI/web shells share one persistable core. Pure data, no I/O.
serde = { workspace = true }
roxmltree = "0.21.1"
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Tests only: Set round-trips and the legacy-session migration are claims
# about the wire format, so they are checked against real JSON.
serde_json = { workspace = true }

[lints]
workspace = true
