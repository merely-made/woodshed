[workspace]
resolver = "3"
members = [
    "crates/woodshedding",
    "crates/woodshed-audio",
    "crates/audio-primitives",
    "crates/timed-text",
    "crates/woodshed-core",
    "crates/woodshed-views",
    "crates/woodshed-genet",
    "crates/woodshed-web",
    # The chartulary substrate's first real consumer (G3): woodshed's theory
    # catalog as a content graph. Folded in from its own repo 2026-07-08.
    "crates/woodshed-graph",
    # Bluetooth control of a smart instrument; see
    # design_docs/2026-08-27_smart_instrument_plan.md
    "crates/woodshed-instrument",
]
exclude = [
    "ports/hocket",
    "ports/redshank",
    "ports/ringdown",
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
authors = ["Mark <sgt.mark3@gmail.com>"]
repository = "https://github.com/merely-made/woodshed"
rust-version = "1.96"

[workspace.dependencies]
pictograph = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176", default-features = false, features = ["canvas"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
scenograph = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
blake3 = "1"
# Internal crates
woodshedding = { path = "crates/woodshedding", version = "0.1.0" }
# Portable state/logic core for the genet-host stack (W1.1 split).
woodshed-core = { path = "crates/woodshed-core", version = "0.1.0" }
woodshed-audio = { path = "crates/woodshed-audio", version = "0.1.0" }
woodshed-graph = { path = "crates/woodshed-graph", version = "0.1.0" }
mere-surface-api = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
workbench = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
# Shared pure-DSP primitives (click synth, onset/tempo, latency) — the
# `audio-primitives` extraction. Pure std; consumed by woodshed-audio
# here and cross-repo by strophe-engine via path-dep.
audio-primitives = { path = "crates/audio-primitives", version = "0.1.0" }
# (pitch-detection is declared further down under "Audio".)

# The mark-ik/xilem Masonry fork is fully retired (2026-07-08): its last
# consumers — the shared xilem-components + audio-widgets crates, used by
# Strophe's Masonry app — are gone now Strophe runs on Cambium with
# Sprigging leaves. Woodshed itself has been Genet-only since the S5 cut.
winit = "0.30"

# UI — Genet host (2026-07-04 genet-host plan). The woodshed app now
# rides this stack exclusively. Git deps on the owned repos so any machine
# resolves;
# local checkouts are picked up via the gitignored .cargo/config.toml
# source-specific [patch] overrides (the Mere pattern). Cambium supplies
# the view toolkit and Sprigging leaves; Genet supplies the engine and host.
# From genet's git, NOT crates.io — the same rule hocket landed on 2026-07-24
# after a clean Linux checkout caught it. Two reasons, and both only show up
# away from a dev machine whose gitignored [patch] file hides them:
#
#   1. ~~`cambium-winit` can never be published.~~ **Fixed 2026-07-26 by
#      splitting it.** The consolidation had rewired it onto genet-layout and
#      genet-winit-host, which inherit genet's `publish = false`. Those two are
#      needed by the a11y host alone, which now lives in `cambium-winit-a11y`;
#      the thin `cambium-winit` depends on `cambium` + `winit` only and
#      dry-run-publishes clean. Reason 2 still stands on its own, and Mark ruled
#      git-first for the whole family on 2026-07-26 regardless, so nothing here
#      moves to the registry.
#   2. The published cambium/sprigging depend on the crates.io `paint_list_api`
#      while we (and the rest of the genet stack) git-dep netrender's, so a
#      `sprigging::PaintCmd` is not a `paint_list_api::PaintCmd`.
#      `[patch.crates-io]` does not redirect a published crate's own registry
#      dependency; taking all three from the source everything else uses does.
cambium = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
cambium-rootstock = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
cambium-genet-web-host = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
woodshed-web = { path = "crates/woodshed-web" }
# The single-root Cambium desktop host (genet G1, 2026-08-09). Woodshed was its
# donor and is now its first consumer: the whole ApplicationHandler / SurfaceHost
# / layout / paint / input / A11yHost assembly that used to live in
# woodshed-genet's main.rs is this package. Never publishable (it rides
# genet-layout and genet-winit-host).
#
# The toolkit/host crates come from Mere at `11236fd4`; raw Genet engine
# crates use `7422e906`, the Genet that Mere revision pins. Cargo keys a git
# source by URL and reference, so the split is intentional and keeps one source
# identity for each family.
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
sprigging = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.2" }
mesquite = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
taproot = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda" }
# genet-layout, genet-winit-host, netrender, paint_list_api, paint_list_render,
# cambium-winit and cambium-winit-a11y are deliberately NOT declared here any
# more. They were the pieces woodshed needed to assemble a native host itself;
# `cambium-genet-winit-host` is that assembly, and reaching around it would put
# the duplication straight back. They still arrive transitively, so nothing in
# the resolved graph changed — only what this workspace is allowed to name.
#
# wgpu stays: the scenario lane still touches a `wgpu::TextureView` in the
# capture the host hands it. Backend features come from netrender's own
# per-target manifest split, transitively. The genet stack is wgpu 30.
wgpu = { version = "30", default-features = false, features = ["std"] }

# Theming: pure OKLCH seed-to-palette derivation from the same Mere source
# as the toolkit and shared appearance authoring.
tinct = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
# Shared theme authority and its reusable appearance-authoring surface.
tabard = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }

# Audio
cpal = "0.18"
pitch-detector = { version = "0.3", features = ["hinted"] }
# `pitch-detection` (separate crate from `pitch-detector` above)
# ships the time-domain detectors — Autocorrelation, McLeod (NSDF),
# YIN — that pitch-detector left commented-out. We use the
# `McLeodDetector` for octave-confusion-resistant tuning on guitar
# low strings. Conversion from raw frequency to note/cents is done
# locally; this crate just supplies the frequency estimate.
pitch-detection = "0.3"
hound = "3.5"
midir = "0.11"

# Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Identity. Woodshed opens no vault: it calls djinn over Graphshell's custody
# route (dramatis DR-C, D5) for the roster, a persona switch and the one
# sealing key it needs. `personae` lends key types and sealing, `dramatis` the
# roster's plain types, and `mere-persona-picker` the shared view over the
# roster: the same question every Merely application asks, drawn the same way
# everywhere. Declared here because woodshed-views draws the roster and
# woodshed-genet acts on it. personae and dramatis live in merely-made/dramatis
# since DR-D, pinned at the revision mere's workspace names, so one personae
# reaches every graph.
dramatis = { git = "https://github.com/merely-made/dramatis.git", rev = "c1d620764315b4c750fcffea30b8c898b8bb73bc" }
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "c1d620764315b4c750fcffea30b8c898b8bb73bc" }
persona-picker = { package = "mere-persona-picker", git = "https://github.com/merely-made/mere.git", rev = "5dca58a95f91fe237febe80126316ddcb8796176" }

# Future:
#   fundsp          — DSP for fancier sounds (deferred — raw sin is enough for click)
#   symphonia       — FLAC / OGG / MP3 sample loading (deferred — WAV via hound is enough for now)

# PDB symbol-length limit on Windows MSVC is handled by the
# /DEBUG:LongSymbolTruncate linker flag set in .cargo/config.toml.
# Xilem's deeply-nested generic view types would otherwise overflow
# the per-symbol PDB budget (LNK4319) on dev builds; the truncate
# mode keeps debug info usable while bumping the limit.

# Mirror of genet's [patch.crates-io] entries this workspace's genet
# graph needs — patches are per-workspace-root and do NOT inherit through
# a git dep (the mere root carries the same mirror). No local paths here:
# the DOM seams and Taffy are reached through the same Git
# revision as the Genet family above. Parley needs no row: genet's fork is
# `genet-parley` now, which genet-livery reaches inside genet.
[patch.crates-io]
# The p2panda fork Mere's transport rides, reached through Graphshell's custody
# client (dramatis DR-C). `[patch]` is per workspace root, so this restates
# Mere's rows: the tagged `mere-p2panda-net =0.7.5` release and its siblings.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.2" }
taffy = { package = "genet-taffy", git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.14.0" }
# NO stylo/stylo_atoms patch (2026-07-12, mirroring genet's ring-3 rename):
# the fork is now the RENAMED `genet-stylo` family, and a `[patch]` cannot
# rename its target. Genet's crates git-dep genet-stylo by package rename, so
# no crates.io `stylo` is left to patch — and keeping the old entries pulled the
# pre-rename fork in beside genet-stylo, which `links = "servo_style_crate"`
# (one Stylo per graph) makes a hard resolution error.
#
# The stylo_taffy patch that stood here was removed 2026-08-27: genet dropped
# Stylo, so genet.git no longer provides that package and the patch could not
# resolve, which failed the whole workspace rather than just the Stylo lane.
# Nothing here depends on stylo_taffy; the entry outlived its subject.
# Taffy is different: Buckram/Livery consume the renamed `genet-taffy` package,
# so the patch above names that package explicitly while retaining the
# dependency alias Cargo expects.
# The maintained renderer uses checked native shader compilation, initialized
# workgroup memory, and validated fine command/segment spans. Cargo patches are
# workspace-root authority: Mere's patch is not inherited by this application.
netrender-vello = { git = "https://github.com/mark-ik/vello.git", rev = "491c376cf2b01fc11132cf8f86419dec114ae032" }
vello_encoding = { git = "https://github.com/mark-ik/vello.git", rev = "491c376cf2b01fc11132cf8f86419dec114ae032" }
vello_shaders = { git = "https://github.com/mark-ik/vello.git", rev = "491c376cf2b01fc11132cf8f86419dec114ae032" }
# Legacy callers still use the unrenamed Vello package and its wgpu-30
# compatibility tag; the Genet render path uses netrender-vello above.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }

# The app remains an ordinary debuggable dev build, but the retained UI and
# renderer beneath it are runtime infrastructure. At opt-level 0 a headed
# 2464x1504 drag receipt spends tens of milliseconds per presented frame in
# this stack after Woodshed's own work has fallen below one millisecond. Keep
# the application crates quick to rebuild while compiling the hot layout,
# paint, and GPU submission path as the code it is meant to exercise.
[profile.dev.package.cambium]
opt-level = 2
[profile.dev.package.cambium-rootstock]
opt-level = 2
[profile.dev.package.genet-render-host]
opt-level = 2
[profile.dev.package.genet-scripted-dom]
opt-level = 2
# Current Genet package names own the hot layout/text path. The legacy
# netrender overrides below cover packages still present elsewhere in the stack.
[profile.dev.package.genet-render]
opt-level = 2
[profile.dev.package.genet-livery]
opt-level = 2
[profile.dev.package.genet-taffy]
opt-level = 2
[profile.dev.package.buckram]
opt-level = 2
[profile.dev.package.netrender]
opt-level = 2
[profile.dev.package.netrender_device]
opt-level = 2
[profile.dev.package.paint_list_api]
opt-level = 2
[profile.dev.package.paint_list_render]
opt-level = 2
[profile.dev.package.sprigging]
opt-level = 2
[profile.dev.package.vello]
opt-level = 2
[profile.dev.package.vello_encoding]
opt-level = 2
[profile.dev.package.wgpu]
opt-level = 2
[profile.dev.package.wgpu-core]
opt-level = 2
[profile.dev.package.wgpu-hal]
opt-level = 2
