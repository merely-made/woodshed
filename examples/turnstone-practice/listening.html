<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<html lang="en">
<meta charset="utf-8">
<title>Ben Folds – Fired</title>
<style>
  body { margin: 8px 16px; color: #18212a; background: #f4f3ed; font: 14px/20px sans-serif; }
  h1 { margin: 0; font: bold 20px/24px sans-serif; }
  p { margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 36px; }
  label { display: inline-flex; align-items: center; gap: 6px; }
  input, button { box-sizing: border-box; height: 28px; border: 1px solid #637380;
                  border-radius: 3px; background: white; color: inherit; font: inherit; }
  input { width: 88px; padding: 2px 6px; }
  #note { width: 320px; max-width: 60vw; }
  button { padding: 0 8px; cursor: pointer; }
  button:disabled { color: #6c7479; cursor: default; }
  @media (max-width: 490px) { .row { flex-wrap: wrap; margin: 4px 0; } }
</style>
<h1>Ben Folds – Fired</h1>
<p><a id="listening" href="https://www.youtube.com/watch?v=7_xQ4o796H0"
      target="_blank" rel="noopener">Official recording on YouTube</a></p>
<p>Listen to the recording and enter the phrase times in seconds.</p>
<div class="row">
  <label>In <input id="in-time" inputmode="decimal" placeholder="0.000"></label>
  <label>Out <input id="out-time" inputmode="decimal" placeholder="0.000"></label>
</div>
<div class="row">
  <label>Practice note <input id="note"></label>
</div>
<div class="row">
  <button type="button" id="send">Practice this phrase</button>
  <span id="status" role="status"></span>
</div>
<script>
  const listening = document.getElementById("listening");
  const inTime = document.getElementById("in-time");
  const outTime = document.getElementById("out-time");
  const note = document.getElementById("note");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  for (const input of [inTime, outTime, note]) {
    input.addEventListener("input", () => { status.textContent = ""; });
  }

  function milliseconds(input) {
    const seconds = input.value.trim();
    if (!/^\d+(?:\.\d{1,3})?$/.test(seconds)) return NaN;
    return Math.round(Number(seconds) * 1000);
  }

  send.addEventListener("click", async () => {
    const start_ms = milliseconds(inTime);
    const end_ms = milliseconds(outTime);
    if (!Number.isSafeInteger(start_ms) || !Number.isSafeInteger(end_ms) || end_ms <= start_ms) {
      status.textContent = "Enter an out time later than the in time.";
      return;
    }
    send.disabled = true;
    try {
      const response = await fetch("/clip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: document.title,
          source_page_url: location.href,
          listening_url: listening.href,
          start_ms,
          end_ms,
          note: note.value.trim()
        })
      });
      if (!response.ok || (await response.json()).ok !== true) {
        throw new Error("Woodshed rejected the phrase");
      }
      status.textContent = "Sent to Woodshed";
    } catch (error) {
      status.textContent = "Could not send the phrase";
    } finally {
      send.disabled = false;
    }
  });
</script>
