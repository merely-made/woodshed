[package]
name = "musicxml-timing"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MPL-2.0"
publish = false

# An independent consumer: resolving this workspace does not resolve Woodshed,
# Mere, any UI toolkit, persistence, or an audio engine.
[workspace]
resolver = "3"

[dependencies]
woodshedding = { path = "../../crates/woodshedding" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
