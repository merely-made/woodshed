name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Clean-checkout lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve without repository Cargo overrides
        working-directory: ${{ runner.temp }}
        run: >-
          cargo metadata
          --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          --locked
          --format-version 1
          > /dev/null

  core:
    name: Core tests
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p woodshed-core --locked

  linux-host:
    name: Linux host build
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config
      - name: Build native Linux host
        run: cargo build -p woodshed-genet --locked

  windows-host:
    name: Windows host check
    needs: lockfile
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable long Git dependency paths
        run: git config --global core.longpaths true
      - run: cargo check -p woodshed-genet --locked
