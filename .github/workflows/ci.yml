name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: ${{ matrix.workspace }} clean-checkout lockfile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [woodshed, hocket, redshank, ringdown]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Resolve without repository Cargo overrides
        working-directory: ${{ runner.temp }}
        env:
          VALIDATION_WORKSPACE: ${{ matrix.workspace }}
        run: '"$GITHUB_WORKSPACE/scripts/validate-workspace.sh" lockfile "$VALIDATION_WORKSPACE"'

  cpu-tests:
    name: ${{ matrix.workspace }} CPU tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [woodshed, hocket, redshank, ringdown]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install native Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev libdbus-1-dev pkg-config
      - name: Run scoped portable tests without repository Cargo overrides
        working-directory: ${{ runner.temp }}
        env:
          VALIDATION_WORKSPACE: ${{ matrix.workspace }}
        run: '"$GITHUB_WORKSPACE/scripts/validate-workspace.sh" test "$VALIDATION_WORKSPACE"'

  macos-host:
    name: macOS host build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p woodshed-genet --locked

  linux-host:
    name: Linux host build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libfontconfig1-dev pkg-config
      - name: Build native Linux host
        run: cargo build -p woodshed-genet --locked

  windows-host:
    name: Windows host check
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable long Git dependency paths
        run: git config --global core.longpaths true
      - run: cargo check -p woodshed-genet --locked
